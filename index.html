<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elginus - Premium Tech Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --red: #8b0000;
            --red-light: #ff1a1a;
            --black: #0a0a0a;
            --white: #f0f0f0;
            --bg-color: #0a0a0a;
            --text-color: #f0f0f0;
            --card-bg: rgba(20, 20, 20, 0.9);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        header {
            display: flex; flex-direction: column; align-items: center;
            padding: 40px 20px 20px; text-align: center;
            background: radial-gradient(circle at 50% 0%, rgba(139, 0, 0, 0.3) 0%, transparent 70%);
        }
        .logo-container {
            width: 150px; height: 150px; border-radius: 50%;
            border: 3px solid var(--gold);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 20px; box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            animation: logoPulse 3s infinite ease-in-out;
        }
        @keyframes logoPulse {
            0% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
            50% { box-shadow: 0 0 50px rgba(212, 175, 55, 0.8); }
            100% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
        }
        .logo-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        h1 {
            font-family: 'Orbitron', sans-serif; font-size: 2.5rem; color: var(--gold);
            text-shadow: 0 0 10px var(--gold); letter-spacing: 3px;
        }
        p.subtitle { color: #aaa; font-size: 1.1rem; margin-top: 10px; letter-spacing: 2px; }

        /* Filters */
        .filters-container {
            max-width: 1200px; margin: 20px auto; padding: 0 20px;
            display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;
        }
        .filters-container select {
            padding: 12px 20px; background: rgba(0,0,0,0.8); border: 1px solid var(--gold);
            color: var(--white); border-radius: 5px; font-family: 'Rajdhani', sans-serif;
            font-size: 1rem; outline: none; cursor: pointer; transition: all 0.3s ease;
        }
        .filters-container select:focus { box-shadow: 0 0 15px var(--gold); }

        /* Grid */
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .products-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px; margin-top: 20px;
        }
        .product-card {
            background: var(--card-bg); border: 1px solid #333; border-radius: 12px;
            padding: 20px; display: flex; flex-direction: column; position: relative;
            transition: all 0.4s ease; overflow: hidden;
        }
        .product-card:hover {
            transform: translateY(-5px); border-color: var(--gold);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
        }
        .product-image {
            width: 100%; height: 180px; object-fit: cover;
            border-radius: 8px; margin-bottom: 15px; border: 1px solid #444;
        }
        .product-name {
            font-family: 'Orbitron', sans-serif; font-size: 1.2rem;
            color: var(--gold); margin-bottom: 10px;
        }
        .product-desc { font-size: 0.95rem; color: #aaa; margin-bottom: 10px; flex-grow: 1; }
        .product-price {
            font-family: 'Orbitron', sans-serif; font-size: 1.3rem;
            color: var(--red-light); margin-bottom: 15px; text-shadow: 0 0 5px var(--red);
        }
        .product-actions { display: flex; gap: 10px; }
        .btn {
            flex: 1; padding: 10px; background: var(--red); color: var(--white);
            border: none; font-family: 'Orbitron', sans-serif; font-size: 0.9rem;
            cursor: pointer; border-radius: 5px; transition: all 0.3s ease;
            text-transform: uppercase;
        }
        .btn:hover { background: var(--red-light); box-shadow: 0 0 15px var(--red); }

        /* Loading */
        #loading { text-align: center; padding: 50px; color: var(--gold); font-family: 'Orbitron'; }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="logo.png" alt="Elginus Logo" class="logo-img" onerror="this.style.display='none'; this.parentElement.style.background='#222'; this.parentElement.innerHTML='<span style=\'color:var(--gold);font-family:Orbitron;font-size:1.2rem;\'>E</span>';">
        </div>
        <h1>ELGINUS</h1>
        <p class="subtitle">Premium Tech & Gadgets</p>
    </header>

    <div class="filters-container">
        <select id="categoryFilter" onchange="filterProducts()">
            <option value="all">All Categories</option>
        </select>
    </div>

    <div class="container">
        <div class="products-grid" id="productsGrid">
            <div id="loading" style="grid-column: 1/-1;">Loading products...</div>
        </div>
    </div>

    <script>
        let allProducts = [];
        let categories = [];

        // تحميل الأقسام والمنتجات عند فتح الموقع
        async function init() {
            await loadCategories();
            await loadProducts();
        }

        async function loadCategories() {
            try {
                const res = await fetch('/api/index?action=get-categories');
                const data = await res.json();
                if (data.categories) {
                    categories = data.categories;
                    const select = document.getElementById('categoryFilter');
                    categories.forEach(cat => {
                        const opt = document.createElement('option');
                        opt.value = cat;
                        opt.innerText = cat;
                        select.appendChild(opt);
                    });
                }
            } catch (e) { console.error('Failed to load categories'); }
        }

        async function loadProducts() {
            try {
                const res = await fetch('/api/index?action=get-products');
                const data = await res.json();
                allProducts = data.products || [];
                renderProducts(allProducts);
            } catch (e) {
                document.getElementById('productsGrid').innerHTML = '<p style="color:red; grid-column:1/-1; text-align:center;">Failed to load products.</p>';
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            if (products.length === 0) {
                grid.innerHTML = '<p style="color:#888; grid-column:1/-1; text-align:center;">No products available.</p>';
                return;
            }
            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    ${p.imageUrl ? `<img src="${p.imageUrl}" class="product-image" onerror="this.style.display='none'">` : ''}
                    <div class="product-name">${p.name}</div>
                    <div class="product-desc">${p.description || 'No description'}</div>
                    <div class="product-price">$${p.price}</div>
                    <div class="product-actions">
                        <button class="btn" onclick="buyProduct('${p.id}')">Buy Now</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterProducts() {
            const cat = document.getElementById('categoryFilter').value;
            if (cat === 'all') {
                renderProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category === cat);
                renderProducts(filtered);
            }
        }

        function buyProduct(id) {
            alert('Product ID: ' + id + '\n(هنا ممكن تضيف نظام الدفع لاحقاً)');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
