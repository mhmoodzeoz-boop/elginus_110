<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elginus - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37; --red: #8b0000; --red-light: #ff1a1a;
            --black: #0a0a0a; --white: #f0f0f0;
            --bg-color: #0a0a0a; --text-color: #f0f0f0; --card-bg: rgba(20, 20, 20, 0.9);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Rajdhani', sans-serif; min-height: 100vh;
        }
        #loginScreen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box {
            background: var(--card-bg); border: 1px solid var(--gold); padding: 40px;
            border-radius: 10px; box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
            text-align: center; width: 100%; max-width: 400px;
        }
        .login-box h2 { font-family: 'Orbitron'; color: var(--gold); margin-bottom: 20px; }

        #dashboard { display: none; padding: 30px; max-width: 1200px; margin: 0 auto; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 20px;
        }
        .header h1 { font-family: 'Orbitron'; color: var(--gold); }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 0.9rem; }
        input[type="text"], input[type="password"], input[type="number"], textarea, select {
            width: 100%; padding: 12px; background: #000; border: 1px solid #333;
            color: white; border-radius: 5px; font-family: 'Rajdhani'; outline: none;
        }
        input:focus, textarea:focus, select:focus { border-color: var(--gold); }
        button {
            width: 100%; padding: 15px; background: var(--red); color: white;
            border: none; font-family: 'Orbitron'; font-weight: bold; cursor: pointer;
            border-radius: 5px; transition: all 0.3s ease; text-transform: uppercase;
        }
        button:hover { background: var(--red-light); box-shadow: 0 0 20px var(--red); }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .panel {
            background: var(--card-bg); border: 1px solid #333; padding: 25px;
            border-radius: 10px;
        }
        .panel h2 {
            font-family: 'Orbitron'; color: var(--gold); margin-bottom: 20px;
            border-bottom: 1px solid #333; padding-bottom: 10px;
        }

        .product-list { display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto; }
        .product-item {
            background: #111; border: 1px solid #222; padding: 15px; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .product-item h3 { color: var(--gold); font-family: 'Orbitron'; font-size: 1rem; }
        .product-item p { color: #888; font-size: 0.9rem; }
        .actions { display: flex; gap: 5px; }
        .actions button { width: auto; padding: 5px 10px; font-size: 0.8rem; }
        .btn-edit { background: #333; }
        .btn-delete { background: #500; }

        .color-picker { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        .color-picker input[type="color"] { width: 50px; height: 40px; border: none; cursor: pointer; background: transparent; }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-box">
            <h2>Admin Login</h2>
            <div class="form-group">
                <input type="password" id="passwordInput" placeholder="Enter Password">
            </div>
            <button onclick="login()">Login</button>
        </div>
    </div>

    <div id="dashboard">
        <div class="header">
            <h1>ELGINUS ADMIN</h1>
            <button onclick="logout()" style="width:auto; padding:10px 20px; background:transparent; border:1px solid var(--gold); color:var(--gold);">Logout</button>
        </div>

        <div class="dashboard-grid">
            <!-- Product Management -->
            <div class="panel">
                <h2>Add Product</h2>
                <div class="form-group"><label>Name</label><input type="text" id="prodName"></div>
                <div class="form-group"><label>Description</label><textarea id="prodDesc" rows="2"></textarea></div>
                <div class="form-group"><label>Price</label><input type="number" id="prodPrice"></div>
                <div class="form-group"><label>Category</label><select id="prodCategory"></select></div>
                <div class="form-group"><label>Image URL</label><input type="text" id="prodImageUrl" placeholder="https://..."></div>
                <button onclick="addProduct()" id="addBtn">Add Product</button>
            </div>

            <div class="panel">
                <h2>Manage Products</h2>
                <div class="product-list" id="productList"></div>
            </div>

            <!-- Categories & Settings -->
            <div class="panel">
                <h2>Categories</h2>
                <div class="form-group">
                    <input type="text" id="newCategory" placeholder="New Category Name">
                    <button onclick="addCategory()" style="margin-top:10px;">Add Category</button>
                </div>
                <ul id="categoryList" style="list-style:none; margin-top:10px;"></ul>
            </div>

            <div class="panel">
                <h2>Settings</h2>
                <div class="form-group"><label>Change Password</label><input type="password" id="newPassword"></div>
                <button onclick="changePassword()" style="margin-bottom:20px;">Update Password</button>

                <h3 style="color:var(--gold); margin-bottom:10px;">Theme Colors</h3>
                <div class="color-picker"><label>Gold:</label><input type="color" id="colorGold" value="#d4af37"></div>
                <div class="color-picker"><label>Red:</label><input type="color" id="colorRed" value="#8b0000"></div>
                <div class="color-picker"><label>Background:</label><input type="color" id="colorBg" value="#0a0a0a"></div>
                <button onclick="changeTheme()">Apply Theme</button>
            </div>
        </div>
    </div>

    <script>
        let currentPassword = '';
        let editingProductId = null;

        async function login() {
            const pass = document.getElementById('passwordInput').value;
            try {
                const res = await fetch('/api/index', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action: 'login', adminPassword: pass})
                });
                if (res.ok) {
                    currentPassword = pass;
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    loadAll();
                } else { alert('Wrong password'); }
            } catch (e) { alert('Network Error'); }
        }

        function logout() { location.reload(); }

        async function loadAll() {
            await loadCategories();
            await loadProducts();
            loadThemeColors();
        }

        // --- Categories ---
        async function loadCategories() {
            const res = await fetch('/api/index?action=get-categories');
            const data = await res.json();
            const select = document.getElementById('prodCategory');
            const list = document.getElementById('categoryList');
            select.innerHTML = '';
            list.innerHTML = '';
            if (data.categories) {
                data.categories.forEach(cat => {
                    select.innerHTML += `<option value="${cat}">${cat}</option>`;
                    list.innerHTML += `<li style="display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #222;"><span>${cat}</span><button onclick="deleteCategory('${cat}')" style="width:auto; padding:2px 8px; background:#500; font-size:0.7rem;">X</button></li>`;
                });
            }
        }

        async function addCategory() {
            const name = document.getElementById('newCategory').value;
            if (!name) return;
            const res = await fetch('/api/index', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: 'add-category', adminPassword: currentPassword, category: name})
            });
            if (res.ok) { document.getElementById('newCategory').value = ''; loadCategories(); }
            else alert('Failed');
        }

        async function deleteCategory(cat) {
            if (!confirm('Delete category?')) return;
            const res = await fetch('/api/index', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: 'delete-category', adminPassword: currentPassword, category: cat})
            });
            if (res.ok) loadCategories(); else alert('Failed');
        }

        // --- Products ---
        async function loadProducts() {
            const res = await fetch('/api/index?action=get-products');
            const data = await res.json();
            const list = document.getElementById('productList');
            list.innerHTML = '';
            if (data.products) {
                data.products.forEach(p => {
                    list.innerHTML += `
                        <div class="product-item">
                            <div>
                                <h3>${p.name}</h3>
                                <p>$${p.price} | ${p.category}</p>
                            </div>
                            <div class="actions">
                                <button class="btn-edit" onclick="editProduct('${p.id}')">Edit</button>
                                <button class="btn-delete" onclick="deleteProduct('${p.id}')">Delete</button>
                            </div>
                        </div>
                    `;
                });
            }
        }

        async function addProduct() {
            const body = {
                action: editingProductId ? 'edit-product' : 'add-product',
                adminPassword: currentPassword,
                name: document.getElementById('prodName').value,
                description: document.getElementById('prodDesc').value,
                price: document.getElementById('prodPrice').value,
                category: document.getElementById('prodCategory').value,
                imageUrl: document.getElementById('prodImageUrl').value
            };
            if (editingProductId) body.productId = editingProductId;

            const res = await fetch('/api/index', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            if (res.ok) {
                alert('Success');
                resetForm();
                loadProducts();
            } else { alert('Failed'); }
        }

        function editProduct(id) {
            fetch('/api/index?action=get-products').then(r => r.json()).then(data => {
                const p = data.products.find(x => x.id === id);
                if (p) {
                    editingProductId = id;
                    document.getElementById('prodName').value = p.name;
                    document.getElementById('prodDesc').value = p.description;
                    document.getElementById('prodPrice').value = p.price;
                    document.getElementById('prodCategory').value = p.category;
                    document.getElementById('prodImageUrl').value = p.imageUrl || '';
                    document.getElementById('addBtn').innerText = 'Update Product';
                }
            });
        }

        async function deleteProduct(id) {
            if (!confirm('Delete product?')) return;
            const res = await fetch('/api/index', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: 'delete-product', adminPassword: currentPassword, productId: id})
            });
            if (res.ok) loadProducts(); else alert('Failed');
        }

        function resetForm() {
            editingProductId = null;
            document.getElementById('prodName').value = '';
            document.getElementById('prodDesc').value = '';
            document.getElementById('prodPrice').value = '';
            document.getElementById('prodImageUrl').value = '';
            document.getElementById('addBtn').innerText = 'Add Product';
        }

        // --- Settings ---
        async function changePassword() {
            const newPass = document.getElementById('newPassword').value;
            if (!newPass) return alert('Enter password');
            const res = await fetch('/api/index', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: 'change-password', adminPassword: currentPassword, newPassword: newPass})
            });
            if (res.ok) { currentPassword = newPass; alert('Password updated!'); document.getElementById('newPassword').value = ''; }
            else alert('Failed');
        }

        function loadThemeColors() {
            const saved = JSON.parse(localStorage.getItem('elginus_theme') || 'null');
            if (saved) {
                document.getElementById('colorGold').value = saved.gold;
                document.getElementById('colorRed').value = saved.red;
                document.getElementById('colorBg').value = saved.bg;
            }
        }

        function changeTheme() {
            const gold = document.getElementById('colorGold').value;
            const red = document.getElementById('colorRed').value;
            const bg = document.getElementById('colorBg').value;
            // حفظ في localStorage (مؤقتاً، لحد ما نربطه بالباك إند)
            localStorage.setItem('elginus_theme', JSON.stringify({ gold, red, bg }));
            alert('Theme saved locally! (سيتم تطبيقه على الموقع لاحقاً)');
        }

        // تشغيل أولي
        document.addEventListener('DOMContentLoaded', () => {
            // تحميل الثيم عند فتح الصفحة
            const saved = JSON.parse(localStorage.getItem('elginus_theme') || 'null');
            if (saved) {
                document.documentElement.style.setProperty('--gold', saved.gold);
                document.documentElement.style.setProperty('--red', saved.red);
                document.documentElement.style.setProperty('--bg-color', saved.bg);
            }
        });
    </script>
</body>
</html>
